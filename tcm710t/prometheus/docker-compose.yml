x-healthcheck-parameters: &healthcheck-parameters
  interval: 30s
  timeout: 10s
  start_period: 30s
  retries: 3

services:
  prometheus:
    container_name: prometheus
    image: prom/prometheus
    restart: unless-stopped
    user: 1000:1000
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - /docker/prometheus:/prometheus:rw
    healthcheck:
      test: wget -qO- --tries=1 http://localhost:9090/-/healthy
      <<: *healthcheck-parameters

  node-exporter:
    container_name: node-exporter
    image: prom/node-exporter
    restart: unless-stopped
    network_mode: host
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
      - --collector.processes
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    healthcheck:
      test: wget -qO- --tries=1 http://localhost:9100/metrics
      <<: *healthcheck-parameters

  cadvisor:
    container_name: cadvisor
    image: gcr.io/cadvisor/cadvisor
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    healthcheck:
      test: wget -qO- --tries=1 http://localhost:8080/metrics
      <<: *healthcheck-parameters

networks:
  default:
    name: prometheus-network
